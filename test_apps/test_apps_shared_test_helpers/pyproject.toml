[project]
name = "test-apps-shared-test-helpers"
version = "0.1.1"
description = "Shared regression helpers for O2 test applications"
requires-python = ">=3.7,<3.13"
authors = [{ name = "Origen-SDK" }]
dependencies = [
    "pytest>=7",
    "pytest-rerunfailures>=13",
    "origen",
    "pl-ext-cmds",
]

[tool.uv.sources]
origen = { path = "../../python/origen" }
pl-ext-cmds = { path = "../pl_ext_cmds" }

[tool.hatch.build.targets.wheel]
packages = ["test_apps_shared_test_helpers"]

[tool.hatch.build]
artifacts = [
    "test_apps_shared_test_helpers/**/*.toml",
    "test_apps_shared_test_helpers/*.toml",
]

[build-system]
requires = ["hatchling>=1.17.1,<1.18"]
build-backend = "hatchling.build"
