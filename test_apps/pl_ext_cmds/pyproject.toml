[project]
name = "pl-ext-cmds"
version = "0.1.0"
description = "Plugin extending commands"
requires-python = ">=3.7,<3.13"
authors = [{ name = "Origen-SDK" }]
dependencies = ["origen", "origen-metal>=0"]

[dependency-groups]
dev = [
    "pytest>=7",
]

[tool.uv.sources]
origen = { path = "../../python/origen" }

[tool.hatch.build.targets.wheel]
packages = ["pl_ext_cmds"]

[tool.hatch.build]
artifacts = ["pl_ext_cmds/**/*.toml", "pl_ext_cmds/*.toml"]

[build-system]
requires = ["hatchling>=1.17.1,<1.18"]
build-backend = "hatchling.build"
