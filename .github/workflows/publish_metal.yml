name: Publish Origen Metal
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact prepared Origen Metal release tag to publish
        required: true
        type: string
      version:
        description: Expected Origen Metal version
        required: true
        type: string
      publish_python:
        description: Publish the Origen Metal Python package to PyPI
        required: true
        default: false
        type: boolean
      publish_rust:
        description: Publish the origen_metal Rust crate to crates.io
        required: true
        default: false
        type: boolean
      publish_github_release:
        description: Create the prepared Origen Metal GitHub Release
        required: true
        default: true
        type: boolean

concurrency:
  group: publish-origen-metal
  cancel-in-progress: false

env:
  om_ver_file: om_version

jobs:
  precheck:
    runs-on: ubuntu-latest
    steps:
      - name: Require at least one package
        if: ${{ !inputs.publish_python && !inputs.publish_rust }}
        run: |
          echo "Select publish_python, publish_rust, or both when dispatching this workflow."
          exit 1

      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Validate release ref and history
        run: |
          python ci/validate_release.py source \
            --version "${{ inputs.version }}" \
            --tag-prefix origen-metal \
            --tags "$(git tag --points-at HEAD)" \
            --history python/origen/doc/metal/history \
            --manifest python/origen_metal/pyproject.toml \
            --manifest rust/origen_metal/Cargo.toml \
            --manifest rust/pyapi_metal/Cargo.toml

      - name: Set up Python for version check
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require matching Python and Rust versions
        run: |
          python - <<'PY'
          import tomllib

          with open("python/origen_metal/pyproject.toml", "rb") as f:
              python_version = tomllib.load(f)["project"]["version"]
          with open("rust/origen_metal/Cargo.toml", "rb") as f:
              rust_version = tomllib.load(f)["package"]["version"]

          expected = "${{ inputs.version }}"
          if python_version != expected:
              raise SystemExit(
                  f"Origen Metal version mismatch: expected={expected}, Python={python_version}"
              )
          if python_version != rust_version:
              raise SystemExit(
                  f"Origen Metal version mismatch: Python={python_version}, Rust={rust_version}"
              )
          print(f"Publishing Origen Metal {python_version}")
          PY

  build_manylinux:
    if: ${{ inputs.publish_python }}
    needs: [precheck]
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(vars.PYTHON_VERSIONS_FOR_RELEASE) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}

      - name: Run build script in Docker container
        uses: Baardrw/docker-run-action@main
        with:
          image: quay.io/pypa/manylinux2014_x86_64
          options: |
            --user root
            --volume ${{ github.workspace }}:/tmp/o2
            --env GIT_DIR=/tmp/o2
            --env OM_VER_FILE=${{ env.om_ver_file }}
            --env PACKAGE_TO_BUILD=origen_metal
            --env PYTHON_VERSION=${{ matrix.python-version }}
          run: |
            source /tmp/o2/.github/workflows/build_manylinux.sh

      - name: Upload Origen Metal wheel
        uses: actions/upload-artifact@v4
        with:
          name: om_wheels-${{ runner.os }}-${{ matrix.python-version }}
          path: python/origen_metal/wheelhouse/*
          if-no-files-found: error

  build_windows:
    if: ${{ inputs.publish_python }}
    needs: [precheck]
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(vars.PYTHON_VERSIONS) }}
    runs-on: windows-2022
    env:
      ORIGEN_PUBLISH_STEP: "1"
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rust-src-dir: rust/origen_metal
          rustflags:

      - name: Check Rust version
        run: |
          rustc --version
          cargo --version

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"

      - name: Build Origen Metal Python package
        working-directory: python/origen_metal
        # Pin the build interpreter. uv otherwise builds against whichever
        # Python it discovers for the isolated PEP 517 environment, which can
        # silently emit the same ABI tag from several matrix cells.
        run: uv build --wheel --clear --no-create-gitignore --python ${{ matrix.python-version }}

      # Assert the tag at the source. After artifact merge, several cells that
      # all produced the same tag are indistinguishable from a single correct
      # wheel, so a post-merge check cannot catch this.
      - name: Verify wheel targets Python ${{ matrix.python-version }}
        run: >
          python ci/validate_release.py wheels
          --package origen-metal
          --version "${{ inputs.version }}"
          --directory python/origen_metal/dist
          --expect-python-versions "${{ matrix.python-version }}"

      - name: Upload Origen Metal wheel
        uses: actions/upload-artifact@v4
        with:
          name: om_wheels-${{ runner.os }}-${{ matrix.python-version }}
          path: python/origen_metal/dist/origen_metal*
          if-no-files-found: error

  merge_python_wheels:
    if: ${{ inputs.publish_python }}
    needs: [build_manylinux, build_windows]
    runs-on: ubuntu-latest
    steps:
      - name: Merge Origen Metal wheels
        uses: actions/upload-artifact/merge@v4
        with:
          name: om_wheels
          pattern: om_wheels-*

  validate_rust:
    if: ${{ inputs.publish_rust }}
    needs: [precheck]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags:

      - name: Validate origen_metal package
        working-directory: rust/origen_metal
        run: cargo publish --dry-run --locked

  publish:
    needs: [merge_python_wheels, validate_rust]
    if: >-
      ${{
        always() &&
        (inputs.publish_python || inputs.publish_rust) &&
        (!inputs.publish_python || needs.merge_python_wheels.result == 'success') &&
        (!inputs.publish_rust || needs.validate_rust.result == 'success')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}

      - name: Retrieve Origen Metal wheels
        if: ${{ inputs.publish_python }}
        uses: actions/download-artifact@v4
        with:
          name: om_wheels
          path: om_wheels

      - name: List Origen Metal wheels
        if: ${{ inputs.publish_python }}
        run: ls -al ./om_wheels

      - name: Validate Origen Metal wheel versions
        if: ${{ inputs.publish_python }}
        run: python ci/validate_release.py wheels --package origen-metal --version "${{ inputs.version }}" --directory om_wheels

      - name: Publish Origen Metal to PyPI
        if: ${{ inputs.publish_python }}
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: om_wheels
          password: ${{ secrets.PYPI_OM_API_TOKEN }}
          verify-metadata: false
          skip-existing: true
          verbose: true

      - name: Install Rust
        if: ${{ inputs.publish_rust }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rust-src-dir: rust/origen_metal
          rustflags:

      - name: Publish origen_metal to crates.io
        if: ${{ inputs.publish_rust }}
        working-directory: rust/origen_metal
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_ORIGEN_METAL }}
        run: |
          if python - <<'PY' | grep -qx true
          import json, urllib.request
          version = "${{ inputs.version }}"
          with urllib.request.urlopen("https://crates.io/api/v1/crates/origen_metal") as response:
              print("true" if version in {v["num"] for v in json.load(response)["versions"]} else "false")
          PY
          then
            echo "origen_metal ${{ inputs.version }} already exists; skipping duplicate publish"
          else
            cargo publish --locked
          fi

  publish_github_release:
    needs: [publish]
    if: ${{ inputs.publish_github_release }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
      - name: Extract release notes
        run: |
          python ci/extract_release_notes.py \
            --history python/origen/doc/metal/history \
            --tag-prefix origen-metal \
            --version "${{ inputs.version }}" \
            --output release_body.md
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.release_ref }}
          bodyFile: release_body.md
          generateReleaseNotes: false
          allowUpdates: true
