name: Publish Origen Metal

on:
  workflow_dispatch:
    inputs:
      publish_python:
        description: Publish the Origen Metal Python package to PyPI
        required: true
        default: false
        type: boolean
      publish_rust:
        description: Publish the origen_metal Rust crate to crates.io
        required: true
        default: false
        type: boolean

concurrency:
  group: publish-origen-metal
  cancel-in-progress: false

env:
  om_ver_file: om_version

jobs:
  precheck:
    runs-on: ubuntu-latest
    steps:
      - name: Require at least one package
        if: ${{ !inputs.publish_python && !inputs.publish_rust }}
        run: |
          echo "Select publish_python, publish_rust, or both when dispatching this workflow."
          exit 1

      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python for version check
        if: ${{ inputs.publish_python && inputs.publish_rust }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require matching Python and Rust versions
        if: ${{ inputs.publish_python && inputs.publish_rust }}
        run: |
          python - <<'PY'
          import tomllib

          with open("python/origen_metal/pyproject.toml", "rb") as f:
              python_version = tomllib.load(f)["tool"]["poetry"]["version"]
          with open("rust/origen_metal/Cargo.toml", "rb") as f:
              rust_version = tomllib.load(f)["package"]["version"]

          if python_version != rust_version:
              raise SystemExit(
                  f"Origen Metal version mismatch: Python={python_version}, Rust={rust_version}"
              )
          print(f"Publishing Origen Metal {python_version}")
          PY

  build_manylinux:
    if: ${{ inputs.publish_python }}
    needs: [precheck]
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(vars.PYTHON_VERSIONS_FOR_RELEASE) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Run build script in Docker container
        uses: Baardrw/docker-run-action@main
        with:
          image: quay.io/pypa/manylinux2014_x86_64
          options: |
            --user root
            --volume ${{ github.workspace }}:/tmp/o2
            --env GIT_DIR=/tmp/o2
            --env OM_VER_FILE=${{ env.om_ver_file }}
            --env PACKAGE_TO_BUILD=origen_metal
            --env PYTHON_VERSION=${{ matrix.python-version }}
          run: |
            source /tmp/o2/.github/workflows/build_manylinux.sh

      - name: Upload Origen Metal wheel
        uses: actions/upload-artifact@v4
        with:
          name: om_wheels-${{ runner.os }}-${{ matrix.python-version }}
          path: python/origen_metal/wheelhouse/*
          if-no-files-found: error

  build_windows:
    if: ${{ inputs.publish_python }}
    needs: [precheck]
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(vars.PYTHON_VERSIONS) }}
    runs-on: windows-2022
    env:
      ORIGEN_PUBLISH_STEP: "1"
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rust-src-dir: rust/origen_metal
          rustflags:

      - name: Check Rust version
        run: |
          rustc --version
          cargo --version

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          pip install poetry==1.3.2
          poetry --version

      - name: Build Origen Metal Python package
        working-directory: python/origen_metal
        run: poetry build --format wheel

      - name: Upload Origen Metal wheel
        uses: actions/upload-artifact@v4
        with:
          name: om_wheels-${{ runner.os }}-${{ matrix.python-version }}
          path: python/origen_metal/dist/origen_metal*
          if-no-files-found: error

  merge_python_wheels:
    if: ${{ inputs.publish_python }}
    needs: [build_manylinux, build_windows]
    runs-on: ubuntu-latest
    steps:
      - name: Merge Origen Metal wheels
        uses: actions/upload-artifact/merge@v4
        with:
          name: om_wheels
          pattern: om_wheels-*

  validate_rust:
    if: ${{ inputs.publish_rust }}
    needs: [precheck]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags:

      - name: Validate origen_metal package
        working-directory: rust/origen_metal
        run: cargo publish --dry-run --locked

  publish:
    needs: [merge_python_wheels, validate_rust]
    if: >-
      ${{
        always() &&
        (inputs.publish_python || inputs.publish_rust) &&
        (!inputs.publish_python || needs.merge_python_wheels.result == 'success') &&
        (!inputs.publish_rust || needs.validate_rust.result == 'success')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        if: ${{ inputs.publish_rust }}
        uses: actions/checkout@v4

      - name: Retrieve Origen Metal wheels
        if: ${{ inputs.publish_python }}
        uses: actions/download-artifact@v4
        with:
          name: om_wheels
          path: om_wheels

      - name: List Origen Metal wheels
        if: ${{ inputs.publish_python }}
        run: ls -al ./om_wheels

      - name: Publish Origen Metal to PyPI
        if: ${{ inputs.publish_python }}
        uses: pypa/gh-action-pypi-publish@v1.8.10
        with:
          packages-dir: om_wheels
          password: ${{ secrets.PYPI_OM_API_TOKEN }}
          verify-metadata: false
          verbose: true

      - name: Install Rust
        if: ${{ inputs.publish_rust }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rust-src-dir: rust/origen_metal
          rustflags:

      - name: Publish origen_metal to crates.io
        if: ${{ inputs.publish_rust }}
        working-directory: rust/origen_metal
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_ORIGEN_METAL }}
        run: cargo publish --locked
