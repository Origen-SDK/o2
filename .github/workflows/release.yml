name: Release O2 Products

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Coordinated release identifier
        required: true
        type: string
      origen_ref:
        description: Exact Origen release tag; empty when Origen is not selected
        required: false
        default: ""
        type: string
      origen_version:
        description: Expected Origen package version
        required: false
        default: ""
        type: string
      metal_ref:
        description: Exact Origen Metal release tag; empty when Metal is not selected
        required: false
        default: ""
        type: string
      metal_version:
        description: Expected Origen Metal package version
        required: false
        default: ""
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: release-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create scoped release token
        id: release-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.O2_RELEASE_APP_ID }}
          private-key: ${{ secrets.O2_RELEASE_APP_PRIVATE_KEY }}
          owner: Origen-SDK
          repositories: |
            o2
            Origen-SDK.github.io

      - name: Check out exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.origen_ref || inputs.metal_ref }}
          token: ${{ steps.release-token.outputs.token }}
          fetch-depth: 0


      - name: Publish selected products in dependency order
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          GH_REPO: Origen-SDK/o2
          ORIGEN_REF: ${{ inputs.origen_ref }}
          ORIGEN_VERSION: ${{ inputs.origen_version }}
          METAL_REF: ${{ inputs.metal_ref }}
          METAL_VERSION: ${{ inputs.metal_version }}
        shell: bash
        run: |
          set -euo pipefail
          workflow_ref=master

          dispatch_and_wait() {
            local workflow="$1"
            local release_ref="$2"
            shift 2

            local before_id
            before_id="$(gh run list \
              --repo "$GH_REPO" \
              --workflow "$workflow" \
              --event workflow_dispatch \
              --branch "$workflow_ref" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"

            gh workflow run "$workflow" --repo "$GH_REPO" --ref "$workflow_ref" "$@"

            local run_id=""
            for _ in $(seq 1 60); do
              run_id="$(gh run list \
                --repo "$GH_REPO" \
                --workflow "$workflow" \
                --event workflow_dispatch \
                --branch "$workflow_ref" \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty')"
              if [[ -n "$run_id" && "$run_id" != "$before_id" ]]; then
                break
              fi
              sleep 2
            done
            if [[ -z "$run_id" || "$run_id" == "$before_id" ]]; then
              echo "Timed out waiting for $workflow at $release_ref to start" >&2
              return 1
            fi

            echo "Monitoring $workflow run $run_id"
            gh run watch "$run_id" --repo "$GH_REPO" --exit-status
          }

          ensure_github_release() {
            local release_ref="$1"
            local version="$2"
            local history="$3"
            local tag_prefix="$4"
            local title="$5"
            if gh release view "$release_ref" --repo "$GH_REPO" >/dev/null 2>&1; then
              return
            fi
            python ci/extract_release_notes.py \
              --history "$history" \
              --tag-prefix "$tag_prefix" \
              --version "$version" \
              --output release_body.md
            gh release create "$release_ref" \
              --repo "$GH_REPO" \
              --verify-tag \
              --title "$title" \
              --notes-file release_body.md
          }

          metal_registries_complete() {
            curl -fsS "https://pypi.org/pypi/origen-metal/$METAL_VERSION/json" >/dev/null &&
              curl -fsS \
                -H "User-Agent: Origen-SDK O2 release workflow" \
                "https://crates.io/api/v1/crates/origen_metal/$METAL_VERSION" >/dev/null
          }

          origen_registry_complete() {
            curl -fsS "https://pypi.org/pypi/origen/$ORIGEN_VERSION/json" >/dev/null
          }


          if [[ -n "$METAL_REF" ]]; then
            if metal_registries_complete; then
              echo "Origen Metal $METAL_VERSION is already published; skipping package rebuild"
              ensure_github_release \
                "$METAL_REF" \
                "$METAL_VERSION" \
                python/origen/doc/metal/history \
                origen-metal \
                "Origen Metal $METAL_VERSION"
            else
              dispatch_and_wait publish_metal.yml "$METAL_REF" \
                -f "release_ref=$METAL_REF" \
                -f "version=$METAL_VERSION" \
                -f "publish_python=true" \
                -f "publish_rust=true" \
                -f "publish_github_release=true"
            fi
          fi


          origen_prerelease=false
          if [[ "$ORIGEN_VERSION" == *dev* || "$ORIGEN_VERSION" == *alpha* || "$ORIGEN_VERSION" == *beta* ]]; then
            origen_prerelease=true
          fi

          if [[ -n "$ORIGEN_REF" ]]; then
            if origen_registry_complete; then
              echo "Origen $ORIGEN_VERSION is already published; skipping package rebuild"
              ensure_github_release \
                "$ORIGEN_REF" \
                "$ORIGEN_VERSION" \
                python/origen/doc/history \
                origen \
                "Origen $ORIGEN_VERSION"
            else
              dispatch_and_wait publish.yml "$ORIGEN_REF" \
                -f "release_ref=$ORIGEN_REF" \
                -f "version=$ORIGEN_VERSION" \
                -f "publish_pypi=true" \
                -f "publish_pypi_test=false" \
                -f "publish_github_release=true" \
                -f "prerelease=$origen_prerelease"
            fi
          fi


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.87"

      - name: Build release documentation and deploy website
        env:
          github_pat: ${{ steps.release-token.outputs.token }}
          github_username: x-access-token
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path rust/origen/Cargo.toml --bin origen --workspace
          ORIGEN="$PWD/rust/origen/target/debug/origen"
          "$ORIGEN" develop_origen build --metal
          uv sync --project test_apps/python_app --all-groups --no-editable
          cd python/origen
          uv sync --all-groups --no-editable
          "$ORIGEN" web build --release
