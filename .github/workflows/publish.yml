name: Publish Packages
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact prepared Origen release tag to publish
        required: true
        type: string
      version:
        description: Expected Origen package version
        required: true
        type: string
      # build_for_debug_target:
      #   description: If 'true', does not use the '--release' switch when building Rust libraries
      #   required: false
      #   default: "false"
      publish_pypi:
        description: Publish built packages to PyPi
        required: true
        default: false
        type: boolean
      publish_pypi_test:
        description: Publish To PyPI Test Server
        required: true
        default: false
        type: boolean
      publish_github_release:
        description: Publish built packages to Github Release page
        required: true
        default: false
        type: boolean
      prerelease:
        description: Indicate that any release is a pre/dev release
        required: true
        default: true
        type: boolean
      # id:
      #   description: Set the run ID to a known value
      #   required: false
      #   type: number
concurrency:
  group: publish-origen
  cancel-in-progress: false
env:
  origen_ver_file: origen_version
jobs:
  precheck:
    # Need to make sure that only one publish action is running at a time to avoid releases stepping on each other.
    # GA's concurrency only allows for this job replacing previous jobs, but we want the opposite, otherwise we might end up
    # with imcomplete or duplicate releases.
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Validate release ref, version, and history
        shell: bash
        run: |
          set -euo pipefail
          python ci/validate_release.py source \
            --version "${{ inputs.version }}" \
            --tag-prefix origen \
            --tags "$(git tag --points-at HEAD)" \
            --history python/origen/doc/history \
            --manifest python/origen/pyproject.toml \
            --manifest rust/origen/Cargo.toml \
            --manifest rust/origen/cli/Cargo.toml \
            --manifest rust/pyapi/Cargo.toml

      - name: Query Concurrency
        id: query-concurrency
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'always'
          do_not_skip: '[]'
      - name: Check Concurrency
        uses: actions/github-script@v7
        if: ${{ steps.query-concurrency.outputs.should_skip == 'true' }}
        with:
          script: |
            core.setFailed('Found existing publish workflow: ${{ fromJSON(steps.query-concurrency.outputs.skipped_by).htmlUrl }}')

  build_manylinux:
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(vars.PYTHON_VERSIONS_FOR_RELEASE) }}
    needs: [precheck]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
        
      - name: Run Build Script in Docker container
        # Using someone else's fixed version of the docker-run-action until this PR is merged:
        # https://github.com/addnab/docker-run-action/pull/64
        #uses: addnab/docker-run-action@v3
        uses: Baardrw/docker-run-action@main
        with:
          image: quay.io/pypa/manylinux2014_x86_64
          options: |
            --user root
            --volume ${{ github.workspace }}:/tmp/o2
            --env GIT_DIR=/tmp/o2
            --env ORIGEN_VER_FILE=${{ env.origen_ver_file }}
            --env PACKAGE_TO_BUILD=origen
            --env PYTHON_VERSION=${{ matrix.python-version }}
          run: |
            source /tmp/o2/.github/workflows/build_manylinux.sh

      - name: Display Origen Wheelhouse Directory
        working-directory: python/origen
        run: |
          ls wheelhouse
          echo "ORIGEN_WHEEL=$( ls wheelhouse | head -1 )" >> $GITHUB_ENV

      - name: Display Origen Wheelhouse Directory
        run: |
          ls -al python/origen/origen/__bin__/bin
          ls -al rust/pyapi/target/release
          echo ${{ env.ORIGEN_WHEEL }}

      - name: Upload Origen Python Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: origen_wheels-${{runner.os}}-${{matrix.python-version}}
          path: python/origen/wheelhouse/${{ env.ORIGEN_WHEEL }}

      - name: Upload Origen Python Package Version
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.origen_ver_file }}-${{runner.os}}-${{matrix.python-version}}
          path: python/origen/${{ env.origen_ver_file }}

      - name: Upload CLI as a standalone entity
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{runner.os}}-${{matrix.python-version}}
          path: python/origen/origen/__bin__/bin/origen

  build_windows:
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(vars.PYTHON_VERSIONS) }}
    needs: [precheck]

    runs-on: windows-2022
    env:
      ORIGEN_PUBLISH_STEP: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
            toolchain: stable
            rustflags:

      - name: Check Rust Version
        run: |
          rustc --version
          cargo --version

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python Version
        run: python -c "import sys; print(sys.version)"

      - name: Install UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"

      # - name: Build Origen CLI
      #   working-directory: rust/origen/cli
      #   run: cargo build --bins --release
          
      # - name: Add Origen to PATH (Linux)
      #   if: matrix.os == 'ubuntu-latest'
      #   run: echo "${{ github.workspace }}/rust/origen/target/release" >> $GITHUB_PATH

      # - name: Add Origen to PATH (Windows)
      #   if: startsWith(matrix.os, 'windows-')
      #   run: echo "${{ github.workspace }}/rust/origen/target/release" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # - name: Display Origen CLI Version
      #   run: origen -v

      # - name: Build PyAPI
      #   working-directory: rust/pyapi
      #   run: cargo build --release

      # - name: Setup App Env
      #   working-directory: python
      #   run: origen env setup

      # - name: Display Origen App Version
      #   working-directory: python
      #   run: origen -v

      - name: Build Origen Python Package
        working-directory: python/origen
        run: |
          cargo build --manifest-path ../../rust/origen/cli/Cargo.toml --release --bin origen
          cp ../../rust/origen/target/release/origen.exe origen/__bin__/bin/origen.exe
          # --python pins the build interpreter; uv otherwise picks whichever
          # Python it discovers for the isolated build environment, which can
          # silently emit the same ABI tag from several matrix cells.
          uv build --wheel --clear --no-create-gitignore --python ${{ matrix.python-version }}

      - name: Display Dist Directory
        working-directory: python/origen/dist
        run: ls

      # Assert the tag at the source. After artifact merge, several cells that
      # all produced the same tag are indistinguishable from a single correct
      # wheel, so a post-merge check cannot catch this.
      - name: Verify wheel targets Python ${{ matrix.python-version }}
        run: >
          python ci/validate_release.py wheels
          --package origen
          --version "${{ inputs.version }}"
          --directory python/origen/dist
          --expect-python-versions "${{ matrix.python-version }}"

      - name: Upload Origen Python Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: origen_wheels-${{runner.os}}-${{matrix.python-version}}
          path: python/origen/dist/origen*

      - name: Get Origen Python Package Version
        working-directory: python/origen
        shell: bash
        run: python -c "import pathlib,re; print(re.search(r'^version\s*=\s*\"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(), re.M).group(1))" > ${{ env.origen_ver_file }}
  
      - name: Upload Origen Python Package Version
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.origen_ver_file }}-${{runner.os}}-${{matrix.python-version}}
          path: python/origen/${{ env.origen_ver_file }}

      - name: Upload CLI as a standalone entity
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{runner.os}}-${{matrix.python-version}}
          path: python\origen\origen\__bin__\bin\origen.exe

  merge_artifacts:
    needs: [build_manylinux, build_windows]
    runs-on: ubuntu-latest
    steps:
      - name: Merge Origen
        uses: actions/upload-artifact/merge@v4
        with:
          name: origen_wheels
          pattern: origen_wheels-*
      - name: Merge Origen Version Files
        uses: actions/upload-artifact/merge@v4
        with:
          name: ${{ env.origen_ver_file }}
          pattern: ${{ env.origen_ver_file }}-*
      - name: Merge CLI
        uses: actions/upload-artifact/merge@v4
        with:
          name: cli
          pattern: cli-*

  show_wheels:
    needs: [build_manylinux, build_windows, merge_artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
      - name: Retrieve Origen Wheels
        uses: actions/download-artifact@v4
        with:
          name: origen_wheels
          path: origen_wheels

      - name: List Origen Wheels
        run: ls -al ./origen_wheels

      - name: Validate wheel versions
        run: python ci/validate_release.py wheels --package origen --version "${{ inputs.version }}" --directory origen_wheels

      - name: Retrieve Origen Standalone CLI
        uses: actions/download-artifact@v4
        with:
          name: cli
          path: cli

      - name: List Origen CLI
        run: ls -al ./cli

  publish_to_pypi_test:
    needs: [build_manylinux, build_windows, merge_artifacts]
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_pypi_test }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
      - name: Retrieve Wheels
        uses: actions/download-artifact@v4
        with:
          name: origen_wheels
          path: origen_wheels

      - name: Validate wheel versions
        run: python ci/validate_release.py wheels --package origen --version "${{ inputs.version }}" --directory origen_wheels

      - name: List Origen Wheels
        run: ls -al ./origen_wheels

      - name: Push To PyPi Test Server
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: origen_wheels
          password: ${{ secrets.PYPI_TEST_SERVER_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          verify-metadata: false
          skip-existing: true
          verbose: true

  publish_to_pypi:
    needs: [build_manylinux, build_windows, merge_artifacts]
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_pypi }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
      - name: Retrieve Wheels
        uses: actions/download-artifact@v4
        with:
          name: origen_wheels
          path: origen_wheels

      - name: Validate wheel versions
        run: python ci/validate_release.py wheels --package origen --version "${{ inputs.version }}" --directory origen_wheels

      - name: List Origen Wheels
        run: ls -al ./origen_wheels

      - name: Push To PyPi Server
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: origen_wheels
          password: ${{ secrets.PYPI_ORIGEN_API_TOKEN }}
          verify-metadata: false
          skip-existing: true
          verbose: true

  publish_github_release:
    needs: [build_manylinux, build_windows, merge_artifacts]
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_github_release }}
    steps:
        - uses: actions/checkout@v4
          with:
            ref: ${{ inputs.release_ref }}

        - uses: actions/download-artifact@v4
          with:
            name: origen_wheels
            path: origen

        - name: Check wheels directories
          run: ls -al ./origen

        - uses: actions/download-artifact@v4
          with:
            name: cli
            path: cli

        - name: Show downloaded artifact directories
          run: |
            ls -al ./origen
            ls -al ./cli

        - uses: actions/download-artifact@v4
          with:
            name: ${{ env.origen_ver_file }}

        - uses: vimtor/action-zip@v1.1
          with:
            files: origen
            dest: origen.zip

        - uses: vimtor/action-zip@v1.1
          with:
            files: cli
            dest: cli.zip

        - name: Get Origen Version
          run: |
            ls -al
            cat ./${{ env.origen_ver_file }}
            echo "origen_version=$(cat ./${{ env.origen_ver_file }})" >> $GITHUB_ENV

        - name: Show Versions
          run: echo ${{ env.origen_version }}

        - name: Extract release notes
          run: |
            python ci/extract_release_notes.py \
              --history python/origen/doc/history \
              --tag-prefix origen \
              --version "${{ inputs.version }}" \
              --output release_body.md

        - name: Generate Github Release
          uses: ncipollo/release-action@v1
          with:
            artifacts: ./origen.zip, cli.zip
            artifactErrorsFailBuild: true
            prerelease: ${{ inputs.prerelease }}
            tag: ${{ inputs.release_ref }}
            bodyFile: release_body.md
            generateReleaseNotes: false
            allowUpdates: true
            replacesArtifacts: true

  cleanup:
    needs: [precheck, build_manylinux, build_windows, merge_artifacts, publish_to_pypi_test, publish_to_pypi, publish_github_release, show_wheels]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - run: |
          echo "Begin Clean Up..."
          echo "No Clean Up Tasks!"
