name: Regression Tests
on:
  push:
    branches:
      - master
    paths-ignore: &regression-test-paths-ignore
      # Ignore updates to just the publish action
      - '.github/workflows/publish.yml'
      # Ignore updates to just version files for Origen/OM/CLI
      - 'rust/origen/cli/Cargo.toml'
      - 'python/origen/pyproject.toml'
      - 'python/origen_metal/pyproject.toml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: *regression-test-paths-ignore
  workflow_dispatch:

# A new push makes an older run for the same branch obsolete. Cancelling it
# avoids spending the full OS/Python matrix on code that is no longer current.
concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfiles:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Pinned to the toolchain whose rustfmt produced the committed
          # formatting baseline. 'stable' would let a future rustfmt style
          # change fail unrelated PRs. This is independent of the crates'
          # rust-version (1.87); bump it deliberately, reformatting in its own
          # commit. The build and test jobs below still track stable.
          toolchain: "1.89"
          components: rustfmt

      - name: Validate Rust Formatting
        run: |
          cargo fmt --manifest-path rust/origen/Cargo.toml --all -- --check
          cargo fmt --manifest-path rust/origen_metal/Cargo.toml --all -- --check
          cargo fmt --manifest-path rust/pyapi/Cargo.toml --all -- --check
          cargo fmt --manifest-path rust/pyapi_metal/Cargo.toml --all -- --check

      - name: Validate Rust Lockfiles
        run: |
          for manifest in \
            rust/origen/Cargo.toml \
            rust/origen_metal/Cargo.toml \
            rust/pyapi_metal/Cargo.toml \
            rust/pyapi/Cargo.toml
          do
            cargo metadata --locked --format-version 1 --manifest-path "$manifest" > /dev/null
          done

      - name: Install UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true

      # The committed uv.lock files are only meaningful if drift is caught.
      # 'uv sync' silently regenerates a stale lock, so assert freshness here.
      - name: Validate UV Lockfiles
        run: |
          for project in \
            python/origen \
            python/origen_metal \
            test_apps/pl_ext_cmds \
            test_apps/python_app \
            test_apps/python_no_app \
            test_apps/python_plugin \
            test_apps/python_plugin_no_cmds \
            test_apps/python_plugin_the_second \
            test_apps/test_apps_shared_test_helpers
          do
            echo "Checking $project"
            uv lock --check --project "$project"
          done

  build:
    needs: lockfiles
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-22.04", "windows-2022"]
        python-version: ${{ fromJSON(vars.PYTHON_VERSIONS) }}

    runs-on: ${{ matrix.os }}
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v3

      - name: Show Git Version
        run : |
          git --version

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
            toolchain: stable
            rustflags:

      - name: Check Rust Version
        run: |
          rustc --version
          cargo --version

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-py${{ matrix.python-version }}
          workspaces: |
            rust/origen -> target
            rust/pyapi -> target
            rust/origen_metal -> target
            rust/pyapi_metal -> target

      # Windows tool caches are kept on the workspace drive so native dependencies
      # from where the pyproject is located cannot be built. Can workaround this in Windows by updating the
      # AGENT_TOOLSDIRECTORY/RUNNER_TOOL_CACHE environment variables, but I'm unable to get these to stick across steps
      # in GA. Next few steps are all messiness to debug/work around that.
      # Not an issue in Linux, so Windows only will be moved. linux will maintained across different drives.
      - name: Pre-Python Install Setup (Windows-Only)
        if: startsWith(matrix.os, 'windows-')
        run: |
          $env:RUNNER_TOOL_CACHE = '${{ github.workspace }}' | Split-Path | Join-Path -ChildPath o2_GA_tools
          $env:AGENT_TOOLSDIRECTORY = $env:RUNNER_TOOL_CACHE
          mkdir $env:RUNNER_TOOL_CACHE
          echo $env:AGENT_TOOLSDIRECTORY
          echo $env:RUNNER_TOOL_CACHE
          ls $env:AGENT_TOOLSDIRECTORY
          echo "RUNNER_TOOL_CACHE=$env:RUNNER_TOOL_CACHE"
          echo "AGENT_TOOLSDIRECTORY=$env:AGENT_TOOLSDIRECTORY"
          echo "RUNNER_TOOL_CACHE=$env:RUNNER_TOOL_CACHE" >> $GITHUB_ENV
          echo "AGENT_TOOLSDIRECTORY=$env:AGENT_TOOLSDIRECTORY" >> $GITHUB_ENV

      - name: Check ENV Variables (Windows-Only)
        if: startsWith(matrix.os, 'windows-')
        run: |
          echo $env:AGENT_TOOLSDIRECTORY
          echo $env:RUNNER_TOOL_CACHE
          echo $RUNNER_TOOL_CACHE
          echo $AGENT_TOOLSDIRECTORY

      - name: Setup Python ${{ matrix.python-version }}
        if: ${{ !startsWith(matrix.os, 'windows-') }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Python ${{ matrix.python-version }}
        if: startsWith(matrix.os, 'windows-')
        uses: actions/setup-python@v4
        env:
          RUNNER_TOOL_CACHE: D:\a\o2\o2_GA_tools
          AGENT_TOOLSDIRECTORY:  D:\a\o2\o2_GA_tools
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check Python Install (Windows-Only)
        if: startsWith(matrix.os, 'windows-')
        run: |
          echo $RUNNER_TOOL_CACHE
          echo $AGENT_TOOLSDIRECTORY
          echo $env:AGENT_TOOLSDIRECTORY
          echo $env:RUNNER_TOOL_CACHE
          ls $env:AGENT_TOOLSDIRECTORY
          python -c "import os, sys; print(os.path.dirname(sys.executable))"

      # Needed to compile keyring library
      # Install taken from keyring library:
      #  https://github.com/hwchen/keyring-rs/blob/v0.10.1/.github/workflows/ci.yaml#L80-L84
      - name: install libdbus
        timeout-minutes: 10
        run: |
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends libdbus-1-dev
        if: contains(matrix.os, 'ubuntu')

      - name: Build Origen CLI
        working-directory: rust/origen/cli
        run: cargo build --locked --bins
          
      - name: Add Origen to PATH (Linux)
        if: contains(matrix.os, 'ubuntu')
        run: |
          echo "${{ github.workspace }}/rust/origen/target/debug" >> $GITHUB_PATH
          export PATH="${{ github.workspace }}/rust/origen/target/debug:$PATH"

      - name: Add Origen to PATH (Windows)
        if: startsWith(matrix.os, 'windows-')
        run: |
          echo "${{ github.workspace }}/rust/origen/target/debug" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "${{ github.workspace }}/rust/origen/target/debug;$env:Path"

      - name: Display Python Version
        run: |
          python -c "import sys; print(sys.version)"
          pip --version

      - name: Install UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Display Origen CLI Version
        run: origen -v

      - name: Build PyAPI
        run: origen develop_origen build

      - name: Run Poetry Migration Transaction Tests
        if: matrix.python-version == '3.11'
        working-directory: rust/origen
        run: cargo test --locked -p cli migration

      - name: Migrate Historical Poetry Application
        if: contains(matrix.os, 'ubuntu') && matrix.python-version == '3.11'
        run: python ci/test_poetry_migration.py

      - name: Setup App Env
        working-directory: test_apps/python_app
        run: origen env setup

      # Guards the Windows/Python 3.7 provisioning path. UV writes console
      # scripts as a trampoline that hands the executable back to Python to run
      # as an appended zip, which CPython 3.7 cannot read -- it reports a
      # SyntaxError against the .exe. 'origen env setup' installs with pip on
      # that combination so the launchers work. Executing one directly, with no
      # UV involvement, is the assertion that the workaround is still doing its
      # job; it is cheap and fails loudly rather than surfacing later as an
      # unrelated-looking test error.
      - name: Verify venv console scripts are executable (Windows-Only)
        if: startsWith(matrix.os, 'windows-')
        working-directory: test_apps/python_app
        run: .venv\Scripts\pytest.exe --version

      - name: Display Origen App Version
        working-directory: test_apps/python_app
        run: origen -v

      - name: Show Origen Binary Location (Linux)
        if: contains(matrix.os, 'ubuntu')
        run: which origen
      - name: Show Origen Binary Location (Windows)
        if: startsWith(matrix.os, 'windows-')
        run: where.exe origen

      - name: Display UV Version
        working-directory: test_apps/python_app
        run: uv --version

      # - name: Install importlib_metadata (Python 3.12)
      #   run: pip install importlib_metadata

      - name: Show Origen Binary Location (Linux)
        if: contains(matrix.os, 'ubuntu')
        working-directory: test_apps/python_app
        run: |
          which origen
          uv run --no-sync --no-editable which origen
      - name: Show Origen Binary Location (Windows)
        if: startsWith(matrix.os, 'windows-')
        working-directory: test_apps/python_app
        run: |
          where.exe origen
          echo ""
          uv run --no-sync --no-editable where.exe origen

      # TODO GA: Add to build script?
      - name: Move Origen executable (Linux)
        if: contains(matrix.os, 'ubuntu')
        run: cp rust/origen/target/debug/origen python/origen/origen/__bin__/bin
      - name: Move Origen executable (Windows)
        if: startsWith(matrix.os, 'windows-')
        run: cp rust/origen/target/debug/origen.exe python/origen/origen/__bin__/bin

      # One representative Linux job validates the complete user-facing
      # documentation command, including AutoAPI, MyST, Rustdoc, and the
      # example subproject. Sphinx warnings are fatal, while the separate
      # network-dependent external-link checker remains disabled in CI.
      - name: Build Core Documentation
        if: contains(matrix.os, 'ubuntu') && matrix.python-version == '3.11'
        working-directory: python/origen
        run: uv run --no-editable origen web build --clean --sphinx-args="-W --keep-going"

      - name: Show Origen Binary Location (Linux)
        if: contains(matrix.os, 'ubuntu')
        working-directory: test_apps/python_app
        run: |
          which origen
          uv run --no-sync --no-editable which origen
      - name: Show Origen Binary Location (Windows)
        if: startsWith(matrix.os, 'windows-')
        working-directory: test_apps/python_app
        run: |
          where.exe origen
          echo ""
          uv run --no-sync --no-editable where.exe origen

      - name: Run Python-App Unit Tests
        uses: Wandalen/wretry.action@v1.3.0
        env:
          PYTHONPATH: ${{ github.workspace }}/rust/pyapi/target${{ runner.os == 'Windows' && ';' || ':' }}${{ github.workspace }}/python/origen_metal
        with:
          attempt_limit: 2
          current_path: test_apps/python_app
          # Routed through 'origen exec' so the wrapper users are told to use
          # stays covered. It prepends the same two debug-backend paths and now
          # preserves the inherited PYTHONPATH, so resolution is identical to
          # invoking 'uv run' directly.
          command: origen exec pytest -vv

      - name: Run Python-App Diff Tests
        working-directory: test_apps/python_app
        run: origen examples

      - name: Setup No-App Env
        uses: Wandalen/wretry.action@v1.3.0
        with:
          attempt_limit: 3
          attempt_delay: 10000 # ms = 10 seconds
          current_path: test_apps/python_no_app
          command: python ../../ci/provision_env.py .

      - name: Display UV Version (No-App)
        working-directory: test_apps/python_no_app
        run: uv --version

      # Copy _origen
      - name: Copy Origen Library (Windows)
        if: startsWith(matrix.os, 'windows-')
        working-directory: .\rust\pyapi\
        run: cp .\target\debug\_origen.dll ..\..\python\origen\_origen.pyd

      # Copy _origen
      - name: Copy Origen Library (Linux)
        if: contains(matrix.os, 'ubuntu')
        working-directory: rust/pyapi
        run: cp target/debug/lib_origen.so ../../python/origen/_origen.so

      # Debug
      - name: Display python/origen directory
        working-directory: test_apps/python_no_app
        run: ls ../../python/origen

      - name: Show Origen Binary Location (Linux)
        if: contains(matrix.os, 'ubuntu')
        working-directory: test_apps/python_no_app
        run: |
          which origen
          uv run --no-sync --no-editable which origen
      - name: Show Origen Binary Location (Windows)
        if: startsWith(matrix.os, 'windows-')
        working-directory: test_apps/python_no_app
        run: |
          where.exe origen
          echo ""
          uv run --no-sync --no-editable where.exe origen

      - name: Display Origen No-App Version
        working-directory: test_apps/python_no_app
        run: uv run --no-sync --no-editable origen -vvv

      - name: Run Python-No-App Unit Tests
        working-directory: test_apps/python_no_app
        run: uv run --no-sync --no-editable pytest -vv
        env:
          PYTHONPATH: ${{ github.workspace }}/rust/pyapi/target${{ runner.os == 'Windows' && ';' || ':' }}${{ github.workspace }}/python/origen_metal

      - name: Run Rust Tests
        if: contains(matrix.os, 'ubuntu') && matrix.python-version == '3.8'
        working-directory: rust/origen
        run: cargo test --locked --workspace

      - name: Run Rust Tests - PyAPI
        if: matrix.python-version == '3.8'
        working-directory: rust/pyapi
        run: cargo test --locked --no-default-features
        env:
          RUSTFLAGS: -D warnings

      - name: Run Rust Tests - Metal PyAPI
        if: matrix.python-version == '3.8'
        working-directory: rust/pyapi_metal
        run: cargo test --locked --no-default-features
        env:
          RUSTFLAGS: -D warnings

      - name: Build PyAPI - Metal
        run: origen develop_origen build --metal

      - name: Setup Python Env - Metal
        working-directory: python/origen_metal
        run: python ../../ci/provision_env.py .

      - name: Run Python Unit Tests - Metal
        working-directory: python/origen_metal
        run: uv run --no-sync --no-editable pytest -vv
        env:
          PYTHONPATH: ${{ github.workspace }}/rust/pyapi/target${{ runner.os == 'Windows' && ';' || ':' }}${{ github.workspace }}/python/origen_metal

      - name: Run Rust Tests - Metal
        if: contains(matrix.os, 'ubuntu') && matrix.python-version == '3.8'
        working-directory: rust/origen_metal
        run: cargo test --locked

      # A global pytest install drives the invocation tests, which deliberately
      # run outside any UV environment. Pinned because this lane also runs on
      # Python 3.7, which pytest 8 dropped.
      - name: Install Pytest
        run: pip install pytest==7.2.1

      - name: Get Pytest Version (Check Install)
        run: pytest --version

      # - name: Run User-Global Invocation Tests
      #   working-directory: test_apps/no_workspace
      #   run: pytest test_user_install.py::TestUserInstall -vv

      # TODO GA: Fold this packaging flow into the UV build configuration.
      # For now, manually move the binary. Also keeps us from having to mess with the path across OSs
      #   'mv' command should be be fine for both linux & powershell
      # Update: remove binary since it is being copied earlier.
      - name: Remove Origen executable (Linux)
        if: contains(matrix.os, 'ubuntu')
        run: rm rust/origen/target/debug/origen
#        run: rm rust/origen/target/debug/origen python/origen/origen/__bin__/bin
      - name: Remove Origen executable (Windows)
        if: startsWith(matrix.os, 'windows-')
        run: rm rust/origen/target/debug/origen.exe
#        run: rm rust/origen/target/debug/origen.exe python/origen/origen/__bin__/bin

      # TODO GA: Regressions: not sure why, but the tmp directory in origen_metal causes some issues
      # For now, just removing it.
      - name: Remove origen_metal tmp Directory
        run: rm python/origen_metal/tmp -r

      # setuptools-rust compiles '_origen' as part of the wheel build, so this
      # produces a release extension rather than packaging the debug library.
      - name: Build Origen Wheel
        working-directory: python/origen
        run: uv build --wheel --clear --no-create-gitignore

      - name: Build Origen Metal Wheel
        working-directory: python/origen_metal
        run: uv build --wheel --clear --no-create-gitignore


      # uv writes a '.gitignore' into the output directory. Dotfiles are not
      # hidden on Windows, so an unfiltered listing picks it up and the wheel
      # name becomes two lines. Suppress the file and match '*.whl' explicitly.
      - name: Save wheel name (Windows)
        if: startsWith(matrix.os, 'windows-')
        working-directory: python/origen/dist
        run: |
          Get-ChildItem -Force
          $env:DIST=(Get-ChildItem -Name -Filter *.whl | Select-Object -First 1)
          echo "DIST=$env:DIST" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "DIST ENV..."
          echo $env:DIST
          echo ''
          echo "GITHUB ENV"
          echo $GITHUB_ENV

      - name: Save wheel name (Linux)
        if: contains(matrix.os, 'ubuntu')
        working-directory: python/origen/dist
        run: |
          ls -a
          echo DIST=$(ls *.whl | head -1) >> $GITHUB_ENV

      - name: Check Global Pip/UV Versions
        run: |
          pip --version
          uv --version

      - name: Install local Origen packages globally (Windows)
        if: startsWith(matrix.os, 'windows-')
        run: |
          echo $GITHUB_ENV
          echo "Installing Local OM candidate and Origen ($env:DIST)"
          pip install --find-links python/origen_metal/dist python/origen/dist/$env:DIST

      - name: Install local Origen packages globally (Linux)
        if: contains(matrix.os, 'ubuntu')
        run: |
          echo "Installing Local OM candidate and Origen ($DIST)"
          pip install --find-links python/origen_metal/dist python/origen/dist/$DIST

      - name: Show Origen Binary Location (Linux)
        if: contains(matrix.os, 'ubuntu')
        run: which origen
      - name: Show Origen Binary Location (Windows)
        if: startsWith(matrix.os, 'windows-')
        run: where.exe origen

      - name: Run User-Global Invocation Tests
        working-directory: test_apps/no_workspace
        run: pytest test_user_install.py::TestUserInstall -vv

      # Should be no pyprojects in the root so far. Start with no-workspace tests
      - name: Run No-Workspace-No-Plugins Tests
        working-directory: test_apps/no_workspace
        run: pytest test_no_workspace.py::TestNoWorkspaceNoPlugins -vv
      
      - name: Install Plugins
        run: |
          pip install test_apps/pl_ext_cmds test_apps/test_apps_shared_test_helpers test_apps/python_plugin
          pip install --find-links python/origen_metal/dist python/origen/dist/${{ env.DIST }} --force-reinstall

      - name: Run No-Workspace-With-Plugins Tests
        working-directory: test_apps/no_workspace
        run: pytest test_no_workspace.py::TestNoWorkspaceWithPlugins -vv

      # Leave the no-workspace setup. The global setup should override
      - name: Run Global No-Plugins One Above Site-Packages Dir
        working-directory: test_apps/no_workspace
        run: pytest test_global_install.py::TestGlobalInstallNoPlugins -vv

      - name: Run Global With Plugins At Site-Packages Dir
        working-directory: test_apps/no_workspace
        run: pytest test_global_install.py::TestGlobalInstallWithPlugins -vv

      - name: Run Global No-Plugins At CLI Dir
        working-directory: test_apps/no_workspace
        run: pytest test_global_install.py::TestGlobalInstallAtCliDir -vv

      # With global origen available, test user install errors which fall back to the global install
      - name: Run User Install Errors - Falling Back To Global Install
        working-directory: test_apps/no_workspace
        run: |
          uv --version
          pytest test_user_install.py::TestErrorCasesWithFallback -vv
