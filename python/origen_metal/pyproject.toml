[project]
name = "origen-metal"
version = "1.5.1"
description = "Bare metal APIs for the Origen SDK"
readme = "README.md"
requires-python = ">=3.7,<3.13"
license = { text = "MIT" }
authors = [{ name = "Origen-SDK" }]
classifiers = ["Programming Language :: Python :: 3.12"]
dependencies = [
    "pyreadline3>=3.3,<4; sys_platform == 'win32'",
    "termcolor>=1.1.0",
    "colorama>=0.4.4",
    "importlib-metadata>=6.7.0",
]

[project.urls]
Homepage = "https://origen-sdk.org/o2"
Repository = "https://github.com/Origen-SDK/o2"

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-rerunfailures>=13",
    "pdoc>=7,<8",
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "origen_metal/**/*" },
    { file = "../../rust/pyapi_metal/Cargo.toml" },
    { file = "../../rust/pyapi_metal/**/*.rs" },
    { file = "../../rust/origen_metal/Cargo.toml" },
    { file = "../../rust/origen_metal/**/*.rs" },
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "online: marks tests as requiring an internet connection",
    "ldap: marks tests requiring/using the external LDAP",
]

[tool.maturin]
manifest-path = "../../rust/pyapi_metal/Cargo.toml"
python-source = "."
module-name = "origen_metal._origen_metal"
bindings = "pyo3"
# maturin packages 'python-source' verbatim and does NOT honour .gitignore, so
# any build debris sitting in the package directory is shipped in the wheel.
# Without this, a wheel built from a working checkout carries the maintainer's
# bytecode cache -- measured at 103 stale .pyc files spanning CPython 3.7-3.12.
#
# The staged development extension ('origen develop_origen build --metal' puts
# _origen_metal.so/.pyd here) does NOT need excluding: maturin already drops any
# file matching the configured 'module-name', on every platform.
exclude = [
    "origen_metal/**/__pycache__/**",
    "origen_metal/**/*.py[co]",
    "origen_metal/**/.session/**",
]

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"
