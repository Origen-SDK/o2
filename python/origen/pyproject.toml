[project]
name = "origen"
version = "2.0.0.dev9"
description = "Semiconductor Developer's Kit"
readme = "README.md"
requires-python = ">=3.7,<3.13"
license = { text = "MIT" }
authors = [{ name = "Origen-SDK" }]
dependencies = [
    "origen-metal~=1.5.1",
    "termcolor>=1.1.0",
    "colorama>=0.4",
    "bs4==0.0.1",
    "beautifulsoup4==4.8.2",
    "mako==1.1.0",
    "sphinx==5.3.0; python_version < '3.11'",
    "sphinx==8.2.3; python_version >= '3.11'",
    "origen-autoapi==2.0.1",
    "myst-parser==0.19.1; python_version < '3.11'",
    "myst-parser==5.1.0; python_version >= '3.11'",
    "sphinx-autobuild==2025.8.25; python_version >= '3.11'",
    "pydata-sphinx-theme==0.20.0; python_version >= '3.11'",
    "sphinxbootstrap4theme>=0; python_version < '3.11'",
    "yapf==0.30",
    "jinja2>=3.1,<4",
    "importlib-metadata>=1.7.0",
]

[project.urls]
Homepage = "https://origen-sdk.org/o2"
Repository = "https://github.com/Origen-SDK/o2"

[project.scripts]
origen = "origen_cli:run_origen"

[dependency-groups]
dev = [
    "pytest>=7",
]

[tool.uv.sources]
origen-metal = { path = "../origen_metal" }

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "origen_cli.py" },
    { file = "origen/**/*" },
    { file = "../../rust/pyapi/Cargo.toml" },
    { file = "../../rust/pyapi/**/*.rs" },
    { file = "../../rust/origen/Cargo.toml" },
    { file = "../../rust/origen/**/*.rs" },
    { file = "../../rust/origen_metal/Cargo.toml" },
    { file = "../../rust/origen_metal/**/*.rs" },
    { file = "../../rust/pyapi_metal/Cargo.toml" },
    { file = "../../rust/pyapi_metal/**/*.rs" },
]

[tool.setuptools.packages.find]
include = ["origen*"]

[tool.setuptools]
py-modules = ["origen_cli"]

[tool.setuptools.package-data]
origen = [
    "__bin__/bin/origen",
    "__bin__/bin/origen.exe",
    "web/origen_sphinx_extension/theme/**/*",
    "web/rustdoc/override/*",
]

[[tool.setuptools-rust.ext-modules]]
target = "_origen"
path = "../../rust/pyapi/Cargo.toml"
binding = "PyO3"

[build-system]
requires = [
    "setuptools==68.0.0; python_version < '3.8'",
    "setuptools>=70; python_version >= '3.8'",
    "setuptools-rust==1.7.0; python_version < '3.8'",
    "setuptools-rust>=1.10; python_version >= '3.8'",
    "wheel",
]
build-backend = "setuptools.build_meta"
