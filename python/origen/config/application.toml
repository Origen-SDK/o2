name = "core"
# Define a default target that will be used by a new workspace
#target = "falcon"
# Define a default environment that will be used by a new workspace
#environment = "v93k"
# To make your application workspace run in production mode by default
#mode = "production"
website_release_location = { location = "https://github.com/Origen-SDK/Origen-SDK.github.io.git" }
website_release_name = "o2"

[revision_control]
remote = 'https://github.com/Origen-SDK/o2.git'
release_branch = 'master'
system = 'git'
local = '../..'

[release]
provider = 'github_actions'
orchestrator_workflow = 'release.yml'
origen_workflow = 'publish.yml'
origen_metal_workflow = 'publish_metal.yml'

[publisher]
system = "core.application.Publisher"
