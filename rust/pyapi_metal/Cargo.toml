[package]
name = "origen-metal"
version = "1.5.0"
edition = "2021"
authors = ["Origen-SDK"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "origen_metal"
crate-type = ["cdylib", "lib"]

[dependencies]
indexmap = "1.3.0"
num-bigint = "0.4.0"

# Statically links these libs to make the Python extension more portable
libz-sys = { version = "1.0.25", features = ["static"] }
curl-sys = { version = "0.4.34", features = ["static-curl"] }

[dependencies.origen_metal_backend]
package = "origen_metal"
path = "../origen_metal"
features = ["python"]
default-features = false

[target.x86_64-unknown-linux-gnu.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dependencies.pyo3]
version = "0.21.2"
features = ["num-bigint", "gil-refs"]

[features]
default = ["extension-module"]
extension-module = [
    "pyo3/extension-module",
    "origen_metal_backend/extension-module",
]

[build-dependencies]
built = "0.7.7"

[package.metadata.maturin]
name = "origen_metal._origen_metal"
#requires-dist = ["black"]
