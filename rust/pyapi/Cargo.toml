[package]
name = "origen_pyapi"
version = "2.0.0-dev7"
authors = ["Origen-SDK"]
edition = "2021"

[lib]
name = "_origen"
#proc-macro = true
#cdylib = true
crate-type = ["cdylib"]

## See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
origen = { path = "../origen", default-features = false }
origen_metal = { path = "../origen_metal", features = ["python"], default-features = false }
pyapi_metal = { path = "../pyapi_metal", package = "origen-metal", default-features = false }
num-bigint = "0.4.0"
num-traits = "0.2.0"
num = "0.2.0"
indexmap = "1.3.0"
itertools = "0.8.0"
regex = "1"
paste = "1.0.7"

# Statically links these libs to make the Python extension more portable
libz-sys = { version = "1.0.25", features = ["static"] }
curl-sys = { version = "0.4.34", features = ["static-curl"] }

[target.x86_64-unknown-linux-gnu.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dependencies.pyo3]
version = "0.21.2"
features = ["num-bigint", "multiple-pymethods", "auto-initialize", "gil-refs"]

[features]
default = ["extension-module"]
extension-module = [
    "pyo3/extension-module",
    "origen/extension-module",
    "origen_metal/extension-module",
    "pyapi_metal/extension-module",
]

[build-dependencies]
built = "0.5.2"
